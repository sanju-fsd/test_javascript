<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sneaker Product </title>
<!-- Bootstrap Link -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">

    <!-- Tailwind cdn link -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Fontawasome link -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
</head>
<body>
    <!-- navbar  -->
     <nav class="flex items-center justify-between relative border-b-4 mb-10">
        <div class="flex items-center justify-between p-4 gap-12">
            <button class="btn md:hidden pt-1" >
                <i class="fa-solid fa-bars"></i>
            </button>
            <h1 class="font-bold mb-1 tracking-light text-3xl">Sneakers</h1>

            <div class="hidden md:flex items-center gap-8 text-gray-500 font-semibold h-20">
                <a href="#" class="hover:text-orange-500 hover:border-b-4 items-center flex ">Collections</a>
                <a href="#" class="hover:text-orange-500 hover:border-b-4 items-center flex">Men's</a>
                <a href="#" class="hover:text-orange-500 hover:border-b-4 items-center flex ">Women's</a>
                <a href="#" class="hover:text-orange-500 hover:border-b-4 items-center flex ">About</a>
                <a href="#" class="hover:text-orange-500 hover:border-b-4 items-center flex ">Contact</a>           
            </div>
        </div>

        <div class="flex items-center justify-end p-4 gap-5">
            <button class="btn relative group">
                <i class="fa-solid fa-cart-shopping text-gray-500"></i>
                <span class="absolute -top-2 -right-2 bg-orange-500 text-white rounded-full text-xs w-5 h-5 flex items-center justify-center">3</span>
                </button>
              <img src="https://i.pravatar.cc/100?img=33" alt="Avatar" class="w-10 h-10 rounded-full border-2 border-transparent hover:border-brand-orange cursor-pointer transition-all">
        </div>
    </nav>

    <div class="container">
        <div class="grid max-w-6xl mx-auto p-6 md:p-12 grid-cols-1 md:grid-cols-2 gap-12 items-center">
            <!-- Left side image -->
             <div class="flex flex-col gap-6" >
                <div class="overflow-hidden rounded-lg ">
                     <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80" alt="Sneaker Main" class="w-full h-auto hover:scale-105 transition-transform duration-300">
                </div>

                <div class="grid grid-cols-4 gap-5 h-20">
                    <div class="overflow-hidden rounded-lg cursor-pointer">
                        <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80" alt="Sneaker 1" class="w-full h-auto hover:scale-105 transition-transform duration-300">
                    </div>
                    <div class="overflow-hidden rounded-lg cursor-pointer">
                         <img src="https://images.unsplash.com/photo-1491553895911-0055eca6402d?ixlib=rb-4.0.3&auto=format&fit=crop&w=200&q=80" alt="Thumb 4" class="w-full h-auto hover:scale-105 transition-transform duration-300">
                    </div>
                    <div class="overflow-hidden rounded-lg cursor-pointer">
                        <img src="https://images.unsplash.com/photo-1600185365926-3a2ce3cdb9eb?ixlib=rb-4.0.3&auto=format&fit=crop&w=200&q=80" alt="Thumb 2" class="w-full h-auto hover:scale-105 transition-transform duration-300">
                    </div>
                    <div class="overflow-hidden rounded-lg cursor-pointer">
                        <img src="https://images.unsplash.com/photo-1519744792095-2f2205e87b6f?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80" alt="Sneaker 4" class="w-full h-auto hover:scale-105 transition-transform duration-300">
                    </div>

                </div>
             </div>
            <!-- Right side content -->
             <div class=" py-5">
                <h2 class="font-bold uppercase tracking-widest mb-4"> Sneakers Company </h2>
                <h1 class="font-bold text-4xl mb-6 leading-tight"> Winter Limited Edition Sneakers </h1>
                <p class="text-gray-400 mb-8 leading-relaxed">
                    These low-profile sneakers are your perfect casual wear companion. Featuring a 
                durable rubber outer sole, they'll withstand everything the weather can offer.

                </p>
                <div class="flex flex-col gap-4  mb-6">
                    <div class="flex items-center gap-4">
                        <span class="font-bold text-3xl ">$125.00</span>
                        <span class="bg-orange-100 text-orange-500 font-bold px-2 py-1 rounded-md">50%</span>
                    </div>
                    <div>
                        <span class="text-gray-400 line-through">$250.00</span>
                    </div>
                </div>
                <div class="flex flex-col md:flex-row gap-4">
                    <button class="bg-orange-500 hover:bg-orange-600 text-white font-bold py-4 px-6 rounded-lg w-full flex items-center justify-center gap-3 shadow-lg hover:shadow-xl transition-shadow">
                        <i class="fa-solid fa-cart-shopping"></i>
                        Add to cart
                    </button>
                </div>
             </div>

        </div>
    </div>
</body>
</html>
